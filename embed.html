<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>QPJB — Prochaines soirées (intégration)</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#f4f3f1;background:#121a2b;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;padding:clamp(14px,3vw,28px);background:radial-gradient(ellipse at 12% 0,rgba(110,168,255,.17),transparent 55%),linear-gradient(135deg,#111827,#1b2338);min-width:0}
.wrap{max-width:970px;margin:auto}
header{text-align:center;margin:0 0 22px}
.suits{font-size:17px;letter-spacing:.34em;color:#d8c69f;margin-bottom:5px}
.suits span{color:#ff997f}
h1{font-size:clamp(33px,6vw,52px);letter-spacing:.08em;margin:0;color:#fff8e8}
.subtitle{font-family:Georgia,serif;font-style:italic;color:#d9caa8;font-size:clamp(13px,2.4vw,17px);margin:4px 0 0}
.rule{width:85px;height:3px;border-radius:2px;background:linear-gradient(90deg,#78b2ff,#ff997f);margin:15px auto}
.kicker{text-align:center;letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:#cbd1e0;margin:0 0 15px}
.events{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.event{display:grid;grid-template-columns:65px minmax(0,1fr);gap:14px;align-items:start;padding:19px;border:1px solid rgba(255,255,255,.13);border-radius:16px;background:rgba(255,255,255,.055)}
.date{padding:10px 6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:11px;text-align:center}
.day{font-size:27px;font-weight:800;line-height:1.15}
.month{text-transform:uppercase;font-size:11px;letter-spacing:.07em;color:#bdc6d8}
h2{font-size:clamp(16px,2.7vw,21px);margin:1px 0 9px}
.aix h2{color:#91bdff}.marseille h2{color:#ffa58a}
.details{line-height:1.55;font-size:14px;color:#e0e5f0}
.details strong{color:#fff}
.address{display:block;margin-top:8px;color:#c4cddd}
footer{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px;margin-top:20px}
.more{display:inline-block;text-decoration:none;border-radius:100px;background:#83b3fb;color:#0f192b;padding:11px 22px;font-size:14px;font-weight:750}
.more:hover,.more:focus-visible{background:#c6dcff}
.contact{font-size:12px;text-align:center;margin-top:10px;color:#bac3d4}
.contact a{color:#c5d9ff;text-decoration:none}
.contact a:hover{text-decoration:underline}
.error{color:#ffd0bd;text-align:center;font-size:13px;margin-top:12px}
@media(max-width:590px){.events{grid-template-columns:1fr}.event{padding:15px}.suits{font-size:14px}}
@media(max-width:350px){body{padding:12px}.event{grid-template-columns:54px minmax(0,1fr);gap:10px}.day{font-size:22px}h2{font-size:17px}.details{font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="suits" aria-hidden="true">♠ <span>♥</span> ♣ <span>♦</span></div>
<h1>QPJB</h1>
<p class="subtitle">Quai Provençal des Jeunes Bridgeurs</p>
<div class="rule"></div>
</header>
<p class="kicker">Prochaines soirées cartes</p>
<main class="events">
<section class="event aix" aria-labelledby="aix-title">
<div class="date" aria-label="Date de la prochaine soirée d'Aix"><div class="day" id="aix-day">–</div><div class="month" id="aix-month">…</div></div>
<div><h2 id="aix-title">Aix-en-Provence</h2>
<div class="details"><strong>Mardi <span id="aix-date">…</span></strong> · 19 h – 22 h 30
<span class="address"><span id="aix-addr1"></span><br><span id="aix-addr2"></span></span></div></div>
</section>
<section class="event marseille" aria-labelledby="mar-title">
<div class="date" aria-label="Date de la prochaine soirée de Marseille"><div class="day" id="mar-day">–</div><div class="month" id="mar-month">…</div></div>
<div><h2 id="mar-title">Marseille</h2>
<div class="details"><strong>Mardi <span id="mar-date">…</span></strong> · 19 h – 22 h 30
<span class="address"><span id="mar-addr1"></span><br><span id="mar-addr2"></span></span></div></div>
</section>
</main>
<footer><a class="more" href="https://capgui13.github.io/QPJB13/" target="_blank" rel="noopener noreferrer">Découvrir le Quai ↗</a></footer>
<p class="contact">Contact : <a href="mailto:qpjb.aix@gmail.com">Aix-en-Provence</a> · <a href="mailto:qpjb.marseille@gmail.com">Marseille</a></p>
<p class="error" id="error" hidden>Impossible de charger les prochaines dates. <a href="https://capgui13.github.io/QPJB13/" target="_blank" rel="noopener noreferrer" style="color:inherit">Voir le site du Quai</a>.</p>
</div>
<script>
'use strict';
const MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const SHORT=['JANV','FÉVR','MARS','AVR','MAI','JUIN','JUIL','AOÛT','SEPT','OCT','NOV','DÉC'];
const el=id=>document.getElementById(id);
function parseISO(iso){if(!iso)return null;const [y,m,d]=iso.split('-').map(Number);return y&&m&&d?new Date(y,m-1,d):null;}
function prochaineDate(bloc){
 const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
 const get=t=>Number(parts.find(p=>p.type===t).value);
 const today=Date.UTC(get('year'),get('month')-1,get('day'));
 const current=parseISO(bloc.current),next=parseISO(bloc.next);
 const utc=d=>Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
 if(current&&utc(current)>=today)return current;
 const base=next||current;if(!base)return null;
 const diff=Math.max(0,Math.ceil((today-utc(base))/86400000));
 const result=new Date(base.getFullYear(),base.getMonth(),base.getDate());
 result.setDate(result.getDate()+Math.ceil(diff/14)*14);
 return result;
}
function render(prefix,bloc){
 const d=prochaineDate(bloc);
 el(prefix+'-day').textContent=d?String(d.getDate()):'–';
 el(prefix+'-month').textContent=d?SHORT[d.getMonth()]:'–';
 el(prefix+'-date').textContent=d?d.getDate()+' '+MONTHS[d.getMonth()]:'à venir';
 el(prefix+'-addr1').textContent=bloc.adresse1||'';
 el(prefix+'-addr2').textContent=bloc.adresse2||'';
}
async function refresh(){
 try{
  const response=await fetch('data.json?t='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw new Error('data.json inaccessible');
  const data=await response.json();
  render('aix',data.aix);render('mar',data.marseille);el('error').hidden=true;
 }catch(err){console.error('QPJB embed:',err);el('error').hidden=false;}
}
refresh();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
setInterval(()=>{if(!document.hidden)refresh();},3600000);
</script>
</body>
</html>
